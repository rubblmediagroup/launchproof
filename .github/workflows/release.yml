name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v1.*'

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: verify / node-${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:version
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:scanner-fixtures
      - run: npm run build -w @launchproof/web
      - run: npm run build -w @launchproof/cli
      - run: npm pack -w @launchproof/cli --dry-run
      - name: Controlled reference scenario
        run: npm run cli -- analyze scenarios/production-reference --json .launchproof/reference.json
      - name: Controlled regression scenario
        run: npm run cli -- analyze scenarios/missing-tenant-authorization --json .launchproof/regression.json
      - name: Senten contract scenario
        run: npm run cli -- analyze scenarios/senten-reference --json .launchproof/senten.json
      - name: Self analysis
        run: npm run cli -- analyze . --json .launchproof/self-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-node-${{ matrix.node }}
          path: .launchproof/*.json
          if-no-files-found: ignore

  release-surfaces:
    name: web / e2e / docker
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build -t launchproof-v1-candidate .
      - run: docker compose config --quiet

  artifacts:
    name: release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: mkdir -p artifacts
      - run: npm run build -w @launchproof/cli
      - run: npm pack -w @launchproof/cli --pack-destination artifacts
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > artifacts/launchproof-sbom.cdx.json
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: launchproof-release-artifacts
          path: artifacts/

  desktop-windows:
    name: desktop / windows
    runs-on: windows-latest
    timeout-minutes: 45
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup default stable
          rustc --version
          cargo --version
      - run: npm run build -w @launchproof/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: launchproof-desktop-windows
          path: apps/desktop/src-tauri/target/release/bundle/
          if-no-files-found: error

  container:
    name: container / ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verify, release-surfaces]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ghcr.io/rubblmediagroup/launchproof:${GITHUB_REF_NAME:-candidate} .
      - name: Publish tag image
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/rubblmediagroup/launchproof:"${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_NAME}" = "v1.0.0" ]; then
            docker tag ghcr.io/rubblmediagroup/launchproof:"${GITHUB_REF_NAME}" ghcr.io/rubblmediagroup/launchproof:latest
            docker push ghcr.io/rubblmediagroup/launchproof:latest
          fi

  github-release:
    name: github release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [artifacts, desktop-windows, container, release-surfaces]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Final checksums
        run: |
          find release-assets -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS-all.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}"             --verify-tag             --generate-notes             --title "LaunchProof ${GITHUB_REF_NAME}"             release-assets/*
