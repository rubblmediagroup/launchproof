name: format repair
on:
  push:
    paths:
      - '.github/format-request'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run format
      - name: Commit formatting repair
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "launchproof-ci"
          git config user.email "launchproof-ci@users.noreply.github.com"
          git add .
          git commit -m "style: normalize v1 product build"
          git push origin HEAD:main
