name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  verify-runtime:
    name: verify / node-${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - name: Dependency lock required
        run: test -f package-lock.json || { echo 'package-lock.json is required for reproducible public CI'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check:version
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:scanner-fixtures
      - run: npm run build -w @launchproof/web
      - run: npm run build -w @launchproof/cli
      - run: npm pack -w @launchproof/cli --dry-run
      - name: CLI reference smoke test
        run: npm run cli -- analyze scenarios/production-reference --json /tmp/launchproof-report.json
      - name: CLI Senten contract smoke test
        run: npm run cli -- analyze scenarios/senten-reference --json /tmp/launchproof-senten-report.json

  release-surfaces:
    name: release surfaces / node-24
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify-runtime
    steps:
      - uses: actions/checkout@v4
      - name: Dependency lock required
        run: test -f package-lock.json || { echo 'package-lock.json is required for reproducible public CI'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Install browser for E2E
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Docker build
        run: docker build -t launchproof-ci .
