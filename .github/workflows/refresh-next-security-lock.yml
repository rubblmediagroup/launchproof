name: refresh-next-security-lock

on:
  push:
    paths:
      - '.github/workflows/refresh-next-security-lock.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve current Next 15 maintenance security release
        run: |
          npm install --package-lock-only --ignore-scripts -w @launchproof/web next@15.5.26
          npm install --package-lock-only --ignore-scripts --save-dev eslint-config-next@15.5.26
      - name: Verify resolved versions
        run: |
          node -e "const p=require('./apps/web/package.json'); if (!/^\\^?15\\.5\\.26$/.test(p.dependencies.next)) process.exit(2)"
          node -e "const l=require('./package-lock.json'); if (l.packages['node_modules/next']?.version !== '15.5.26') process.exit(2)"
      - name: Commit genuine lockfile refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/web/package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(deps): upgrade Next.js to 15.5.26 security patch"
          git push
